name: Issue Management Automation

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write
  contents: write
  pull-requests: write
  repository-projects: write

jobs:
  ensure-resources:
    name: Ensure Labels and Milestone Exist
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    steps:
      - name: Create required labels
        uses: actions/github-script@v7
        with:
          script: |
            const labelDefs = [
              { name: 'bug', color: 'd73a4a', description: "Something isn't working" },
              { name: 'enhancement', color: 'a2eeef', description: 'New feature or request' },
              { name: 'epic', color: '8b5cf6', description: 'Large feature requiring multiple sub-tasks' },
              { name: 'maintenance', color: '0e8a16', description: 'Maintenance and housekeeping tasks' },
              { name: 'priority-critical', color: 'b60205', description: 'Critical priority issue' },
              { name: 'priority-high', color: 'd93f0b', description: 'High priority issue' },
              { name: 'priority-medium', color: 'fbca04', description: 'Medium priority issue' },
              { name: 'priority-low', color: 'c2e0c6', description: 'Low priority issue' },
              { name: 'needs-triage', color: 'c5def5', description: 'Needs to be reviewed by maintainers' },
              { name: 'needs-review', color: 'fef2c0', description: 'Awaiting review from maintainers' },
              { name: 'first-time-contributor', color: '7057ff', description: 'Issue created by first-time contributor' },
            ];
            for (const label of labelDefs) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label,
                });
                console.log(`Created label: ${label.name}`);
              } catch (err) {
                if (err.status === 422) {
                  try {
                    await github.rest.issues.updateLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      name: label.name,
                      color: label.color,
                      description: label.description,
                    });
                    console.log(`Updated existing label: ${label.name}`);
                  } catch (e2) {
                    console.log(`Skipping label ${label.name}: ${e2.message}`);
                  }
                } else {
                  console.log(`Error creating label ${label.name}: ${err.message}`);
                }
              }
            }

      - name: Ensure milestone v1.0.0 exists
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data: milestones } = await github.rest.issues.listMilestones({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });
              const exists = milestones.some(m => m.title === 'v1.0.0');
              if (!exists) {
                await github.rest.issues.createMilestone({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: 'v1.0.0',
                  description: 'First major release',
                });
                console.log('Created milestone v1.0.0');
              } else {
                console.log('Milestone v1.0.0 already exists');
              }
            } catch (err) {
              console.log(`Milestone setup error: ${err.message}`);
            }

  issue-triage:
    name: Issue Triage
    needs: [ensure-resources]
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Apply category and priority labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = (issue.title || '').toLowerCase();
            const body = (issue.body || '').toLowerCase();
            const text = `${title} ${body}`;

            const labelsToAdd = ['needs-triage'];

            // Category labels (based on title only)
            if (title.includes('bug')) {
              labelsToAdd.push('bug');
            }
            if (title.includes('epic')) {
              labelsToAdd.push('epic');
            }
            if (title.includes('maintenance')) {
              labelsToAdd.push('maintenance');
            }

            // Priority labels (based on title OR body); highest wins
            const criticalKeywords = ['critical', 'urgent', 'production', 'outage'];
            const highKeywords = ['important', 'high', 'blocking'];
            const lowKeywords = ['low', 'nice-to-have', 'minor'];
            const mediumKeywords = ['medium', 'normal'];

            let priority = 'priority-medium'; // default
            if (criticalKeywords.some(k => text.includes(k))) {
              priority = 'priority-critical';
            } else if (highKeywords.some(k => text.includes(k))) {
              priority = 'priority-high';
            } else if (mediumKeywords.some(k => text.includes(k))) {
              priority = 'priority-medium';
            } else if (lowKeywords.some(k => text.includes(k))) {
              priority = 'priority-low';
            }
            labelsToAdd.push(priority);

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labelsToAdd,
              });
              console.log(`Applied labels: ${labelsToAdd.join(', ')}`);
            } catch (err) {
              console.log(`Failed to add labels: ${err.message}`);
            }

  task-breakdown:
    name: Epic Task Breakdown
    needs: [issue-triage]
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Create sub-issues for Epic
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title || '';

            if (!title.toLowerCase().includes('epic')) {
              console.log('Not an epic, skipping task breakdown');
              return;
            }

            const subTasks = [
              {
                name: 'Requirements Analysis',
                body: 'Analyze the requirements, define acceptance criteria, and gather necessary information for this epic.',
              },
              {
                name: 'Design and Architecture',
                body: 'Design the technical approach, system architecture, and create technical specifications.',
              },
              {
                name: 'Implementation',
                body: 'Implement the feature according to the agreed design and technical specifications.',
              },
              {
                name: 'Testing and Documentation',
                body: 'Write unit/integration tests and update documentation for the new feature.',
              },
            ];

            const subIssueNumbers = [];
            for (let i = 0; i < subTasks.length; i++) {
              const taskNum = i + 1;
              const task = subTasks[i];
              const subTitle = `[SUBTASK] ${title} - Task ${taskNum}: ${task.name}`;
              const subBody = `${task.body}\n\nRelated to #${issue.number}`;

              try {
                const { data: created } = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: subTitle,
                  body: subBody,
                  labels: ['enhancement', 'needs-review'],
                });
                subIssueNumbers.push({ number: created.number, name: task.name });
                console.log(`Created sub-issue #${created.number}: ${subTitle}`);
              } catch (err) {
                console.log(`Failed to create sub-issue Task ${taskNum}: ${err.message}`);
              }
            }

            // Update parent issue body with checklist
            if (subIssueNumbers.length > 0) {
              const checklistLines = [
                '',
                '## Epic Tasks',
                '',
                ...subIssueNumbers.map(
                  (s, i) => `- [ ] #${s.number} - Task ${i + 1}: ${s.name}`
                ),
                '',
              ];
              const checklist = checklistLines.join('\n');
              const newBody = `${issue.body || ''}${checklist}`;

              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: newBody,
                });
                console.log('Parent issue updated with Epic Tasks checklist');
              } catch (err) {
                console.log(`Failed to update parent issue body: ${err.message}`);
              }
            }

  auto-response:
    name: Auto Response
    needs: [issue-triage]
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Post automated response and finalize triage
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = (issue.title || '').toLowerCase();
            const author = issue.user && issue.user.login ? issue.user.login : 'contributor';

            // Check if first issue in this repo for this author (excluding the current issue)
            let isFirstIssue = false;
            try {
              const { data: userIssues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                creator: author,
                state: 'all',
                per_page: 100,
              });
              const priorIssues = userIssues.filter(
                (i) => !i.pull_request && i.number !== issue.number
              );
              isFirstIssue = priorIssues.length === 0;
            } catch (err) {
              console.log(`Could not determine first-issue status: ${err.message}`);
            }

            if (isFirstIssue) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ['first-time-contributor'],
                });
              } catch (err) {
                console.log(`Could not add first-time-contributor label: ${err.message}`);
              }
            }

            // Determine response based on issue type
            const isBug = title.includes('bug');
            const isEpic = title.includes('epic');
            const isMaintenance = title.includes('maintenance');

            let categorySection = '';
            if (isBug) {
              categorySection = [
                '### Bug Report Guidelines',
                '',
                'Thank you for reporting this bug. To help us investigate, please make sure your report includes:',
                '',
                '- **Steps to reproduce** the issue',
                '- **Expected behavior** vs **actual behavior**',
                '- **Environment details** (OS, Node.js version, browser, etc.)',
                '- **Screenshots, stack traces, or logs** when applicable',
                '',
                'A maintainer will triage this issue and respond as soon as possible.',
              ].join('\n');
            } else if (isEpic) {
              categorySection = [
                '### Feature Request Process',
                '',
                'Thank you for submitting this epic feature request! Our process for handling epics:',
                '',
                '1. Initial review and acceptance criteria definition',
                '2. Breakdown into actionable sub-tasks (already created automatically)',
                '3. Prioritization in our backlog',
                '4. Implementation across the planned tasks',
                '',
                'We have created sub-issues for each task. Please review them and contribute to the discussion.',
              ].join('\n');
            } else if (isMaintenance) {
              categorySection = [
                '### Maintenance Guidelines',
                '',
                'Thank you for opening this maintenance request. Maintenance work typically covers:',
                '',
                '- Code refactoring and cleanup',
                '- Dependency upgrades and security patches',
                '- Documentation improvements',
                '- Test coverage and tooling enhancements',
                '',
                'Maintenance issues are generally scheduled into upcoming maintenance windows.',
              ].join('\n');
            } else {
              categorySection = [
                '### General Issue',
                '',
                'Thank you for opening this issue. A maintainer will review it shortly.',
              ].join('\n');
            }

            const welcome = isFirstIssue
              ? [
                  `### 👋 Welcome, @${author}!`,
                  '',
                  'Thank you for opening your **first issue** in this repository. We really appreciate your contribution!',
                  'A maintainer will review your issue shortly. In the meantime, please check the relevant guidelines below.',
                  '',
                  '',
                ].join('\n')
              : '';

            const fullComment = [
              welcome + categorySection,
              '',
              '---',
              '_This comment was generated automatically by the Issue Management Automation workflow._',
            ].join('\n');

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: fullComment,
              });
              console.log('Posted auto-response comment');
            } catch (err) {
              console.log(`Failed to post comment: ${err.message}`);
            }

            // Re-fetch issue to get up-to-date labels (added by issue-triage)
            let labelNames = [];
            try {
              const { data: refreshed } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
              });
              labelNames = (refreshed.labels || []).map((l) =>
                typeof l === 'string' ? l : l.name
              );
            } catch (err) {
              console.log(`Could not refresh issue labels: ${err.message}`);
            }

            const isHighOrCritical =
              labelNames.includes('priority-high') ||
              labelNames.includes('priority-critical');

            // Set milestone v1.0.0 for high/critical priority issues
            if (isHighOrCritical) {
              try {
                const { data: milestones } = await github.rest.issues.listMilestones({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  per_page: 100,
                });
                let milestone = milestones.find((m) => m.title === 'v1.0.0');
                if (!milestone) {
                  const { data: created } = await github.rest.issues.createMilestone({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: 'v1.0.0',
                    description: 'First major release',
                  });
                  milestone = created;
                }
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  milestone: milestone.number,
                });
                console.log(`Assigned milestone v1.0.0 (#${milestone.number}) to issue #${issue.number}`);
              } catch (err) {
                console.log(`Could not assign milestone: ${err.message}`);
              }
            } else {
              console.log('Issue is not high/critical priority, skipping milestone assignment');
            }

            // Move from needs-triage to needs-review
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: 'needs-triage',
              });
              console.log('Removed needs-triage label');
            } catch (err) {
              console.log(`Could not remove needs-triage label: ${err.message}`);
            }
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['needs-review'],
              });
              console.log('Added needs-review label');
            } catch (err) {
              console.log(`Could not add needs-review label: ${err.message}`);
            }
